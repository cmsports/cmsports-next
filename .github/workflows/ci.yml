name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build Next.js app
        # CI verifica la compilación sin conectarse a datos reales. Vercel
        # compila por separado con las variables de su propio proyecto.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
